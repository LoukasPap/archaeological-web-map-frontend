server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: /api/<path> -> http://api:8000/<path>
    # (Host is left as the upstream's so FastAPI redirects are rewritten back under /api by nginx.)
    location = /api/findings {
        # FastAPI serves this route at /findings/; avoid its redirect
        proxy_pass http://api:8000/findings/;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Hashed build assets can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
