# Runs the whole app. Expects the API repo next to this one:
#   thesis/map-tool       <- this repo
#   thesis/map-tool-api   <- API repo (with its own .env; see .env.example there)
#
#   docker compose up --build        ->  http://localhost:8080
services:
  api:
    build: ../map-tool-api
    env_file: ../map-tool-api/.env
    environment:
      # Same-origin through nginx, so CORS is not exercised; kept consistent anyway
      ORIGINS: http://localhost:${WEB_PORT:-8080}
      # nginx exposes the API under /api; lets /api/docs find /api/openapi.json
      UVICORN_ROOT_PATH: /api
    restart: unless-stopped
    healthcheck:
      # Cheap endpoint (does not hit the database)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./ascsa-map-tool
      args:
        VITE_BASE_URL: /api
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
